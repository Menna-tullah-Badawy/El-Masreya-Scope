name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scope
          POSTGRES_PASSWORD: scope123
          POSTGRES_DB: scopedb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install Python deps
        run: |
          pip install -U pip
          pip install -r backend/requirements.txt
      - name: Seed database (Postgres)
        env:
          DATABASE_URL: postgresql+psycopg2://scope:scope123@localhost:5432/scopedb
        run: |
          cd backend
          python -m app.seed --reset
          python -c "from app.database import SessionLocal; from app.models import Product, User; db=SessionLocal(); print(f'Products: {db.query(Product).count()} Users: {db.query(User).count()}'); assert db.query(Product).count()==19"
      - name: Check API imports
        run: |
          cd backend
          python -c "from app.main import app; print('FastAPI OK', app.title)"
      - name: Test pricing engine
        run: |
          cd backend
          python -c "from app.pricing import best_rent_price; from app.models import Product; p=Product(rent_daily=150,rent_weekly=850,rent_monthly=2800); print(best_rent_price(p, 45))"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install Node deps
        run: |
          cd mobile
          npm ci --no-audit --no-fund
      - name: Typecheck
        run: |
          cd mobile
          npx tsc --noEmit
      - name: Build Expo Web
        run: |
          cd mobile
          npx expo export -p web --output-dir ../web-dist || npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://example.com
          CI: "1"
