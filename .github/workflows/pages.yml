name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install deps
        run: |
          cd mobile
          npm ci --no-audit --no-fund
      - name: Export web (Expo)
        env:
          # غيّريها لرابط الـ API الحقيقي بعد نشره على Render/Railway
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL || 'https://scope-api.onrender.com' }}
        run: |
          cd mobile
          npx expo export -p web
          touch dist/index.html 2>/dev/null || true
          ls -lh dist/ 2>&1 | head -n 30
          # حل مشكلة الـ SPA routing على GitHub Pages
          cp dist/index.html dist/404.html 2>/dev/null || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
